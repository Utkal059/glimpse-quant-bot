[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "glimpse-quant-bot"
version = "0.1.0"
description = "Probability-calibration and LS-LMSR execution engine for Glimpse BTC/ETH/SOL/Gold forecasting markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Utkal Singh" }]
keywords = ["glimpse", "lmsr", "prediction-markets", "quant", "trading-bot", "bitcoin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "glimpse-markets>=0.2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "rich>=13.7",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Apache-2.0 TimesFM 2.5 via the SDK's own extra (pulls in PyTorch).
timesfm = ["glimpse-markets[forecasting]>=0.2.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
glimpse-quant-bot = "glimpse_quant_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/glimpse_quant_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "timesfm.*"]
ignore_missing_imports = true
